            <div>

            </div>
            <span>本科 · 全日制</span>

    <template id="template-internships">

      <ol class="timeline">

          <time>2025.09 — 2026.01</time>
          <div>
            <p class="item-meta">市场运营部 · 用户运营实习生（数据分析方向）</p>
            <h3>深圳跃然创新科技有限公司</h3>
            <p class="data-type">私域用户与产品经营数据</p>
            <ul class="achievement-list">
              <li>梳理 1000+ 企业微信用户，迭代标签与分层策略，支持 5000 人社群运营。</li>

        <li>
          <time>2025.03 — 2025.06</time>
          <div>

            <h3>北京网聘信息技术有限公司（智联招聘）</h3>
            <p class="data-type">海外招聘市场与行业情报数据</p>

              <li>监测竞品动态与赛道机会，支持业务判断。</li>
            </ul>
          </div>
        </li>
        <li>
          <time>2024.03 — 2024.06</time>
          <div>
            <p class="item-meta">平台运营部·数据中心组 · 数据分析实习生</p>

    <template id="template-projects">

          <div class="tag-row"><span>Dify</span><span>RAG</span><span>知识库</span></div>
        </article>
        <article class="feature-card feature-sage">
          <p class="item-meta">用户研究 · 服务设计</p>
          <h3>顺丰国际“生日寄”服务创新</h3>
          <p>分析跨境寄递场景，构建用户画像、需求分层和核心痛点优先级，输出服务蓝图与交互原型。</p>
          <div class="tag-row"><span>用户旅程</span><span>服务蓝图</span><span>A/B 测试</span></div>

        <article class="feature-card feature-blue">
          <p class="item-meta">预测建模 · 营销优化</p>
          <h3>电商复购预测与投放策略</h3>
          <p>基于 10 万条用户行为数据完成清洗、分群、标签与特征分析，构建复购预测模型。</p>
          <div class="metric-row"><span><strong>0.723</strong> ROC-AUC</span><span><strong>3.01×</strong> Top 10% Lift</span></div>
        </article>
        <article class="feature-card feature-coral">
          <p class="item-meta">模型评估 · 偏好分析</p>
          <h3>大语言模型人类偏好分析</h3>
          <p>分析多场景投票数据，以 Bradley–Terry 模型、逻辑回归与 Bootstrap 建立候选模型筛选框架。</p>
          <div class="tag-row"><span>135,634 条投票</span><span>53 个模型</span><span>126 种场景</span></div>
        </article>
      </div>
    </template>
